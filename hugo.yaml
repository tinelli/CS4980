# Hugo configuration file
title: CS:4980 Foundations of Embedded Systems - Fall 2026

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true
    # enable hextra passthrough syntax for Latex support
    extensions:
      passthrough:
        delimiters:
          block: [['\[', '\]'], ["$$", "$$"]]
          inline: [['\(', '\)']]
        enable: true
        
  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: Home
      pageRef: /
      weight: 1
    - name: Syllabus
      pageRef: /syllabus
      weight: 2
    - name: Lectures
      pageRef: /lectures
      weight: 3
    - name: Exams
      pageRef: /exams
      weight: 4
    - name: Resources
      pageRef: /resources
      weight: 5
    - name: Search
      weight: 6
      identifier: search
      params:
        type: search
params:
  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: true
    displayPoweredBy: true
    width: normal

